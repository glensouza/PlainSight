<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlainSight Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            cursor: none;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        .player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            opacity: 0;
            z-index: 10;
            transition: opacity 0.6s ease-in-out;
        }

        .player.active {
            opacity: 1;
            z-index: 20;
        }

        /* The 'entering' class keeps the incoming content on top during the cross-fade.
           Opacity is driven by 'active' so it fades in rather than snapping on. */
        .player.entering {
            z-index: 30;
        }

        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            display: none;
            white-space: pre;
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 0, 0, 0.8);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
            max-width: 80%;
            text-align: center;
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a14 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 50;
        }

        /* PNG overlay: sits above the CSS fallback; hidden via onerror if /splash.png is unavailable */
        #splash-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }

        /* CSS fallback: always rendered beneath the PNG overlay */
        #splash-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .splash-logo     { width: 200px; height: 200px; margin-bottom: 40px; }
        .splash-title    { font-size: 56px; font-weight: bold; color: #fff; }
        .splash-subtitle { font-size: 22px; color: #8c8ca5; margin-top: 16px; }
        .splash-device   { font-size: 18px; color: #8c8ca5; margin-top: 24px; }

        #idle-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            display: none;
        }

        .logo-icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #3b82f6;
        }

        .idle-text {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .idle-subtext {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.5;
        }

        /* Emergency overlay sits above everything else (player, branding, idle, status) so a
           broadcast is visible regardless of what was playing when it activated. */
        #emergency-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            background-color: #7f1d1d;
        }

        #emergency-text {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #fff;
            font-size: 64px;
            font-weight: bold;
            text-align: center;
            padding: 60px;
        }

        #emergency-media-wrap {
            display: none;
            width: 100%;
            height: 100%;
        }

        #emergency-image, #emergency-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        #ticker-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: auto;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            z-index: 70;
            display: none;
            padding: 15px 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-top: 3px solid #3b82f6;
            animation: tickerFadeIn 0.6s ease-in-out;
        }

        #ticker-text {
            display: inline-block;
            animation: tickerScroll 8s linear infinite;
            white-space: nowrap;
            overflow: hidden;
        }

        #ticker-overlay.fade #ticker-text {
            animation: tickerFade 4s ease-in-out infinite;
            white-space: normal;
        }

        @keyframes tickerFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes tickerScroll {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        @keyframes tickerFade {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- We use four elements to allow seamless double-buffering for both videos and images -->
        <video id="v-player-1" class="player" autoplay muted playsinline preload="auto"></video>
        <video id="v-player-2" class="player" autoplay muted playsinline preload="auto"></video>
        <img id="i-player-1" class="player">
        <img id="i-player-2" class="player">
    </div>
    
    <div id="status"></div>
    <div id="error-message"></div>
    <div id="loading">
        <img id="splash-img" src="/splash.png" alt="" onerror="this.style.display='none'">
        <div id="splash-fallback">
            <svg class="splash-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
                <defs>
                    <linearGradient id="psGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#22D3EE"/>
                        <stop offset="100%" stop-color="#3B82F6"/>
                    </linearGradient>
                </defs>
                <rect x="2" y="2" width="28" height="28" rx="7" stroke="url(#psGrad)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="11" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1"/>
                <circle cx="16" cy="16" r="7" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1"/>
                <circle cx="16" cy="16" r="3.2" fill="#22D3EE"/>
            </svg>
            <div class="splash-title">PlainSight</div>
            <div class="splash-subtitle">Digital Signage</div>
            <div class="splash-device">{{DEVICE_NAME}} · {{VERSION}}</div>
        </div>
    </div>
    
    <div id="idle-screen">
        <div class="logo-icon">👁️</div>
        <div class="idle-text">PlainSight</div>
        <div class="idle-subtext">Waiting for scheduled content...</div>
    </div>

    <div id="emergency-overlay">
        <div id="emergency-text"></div>
        <div id="emergency-media-wrap">
            <img id="emergency-image">
            <video id="emergency-video" autoplay muted loop playsinline></video>
        </div>
    </div>

    <div id="ticker-overlay">
        <div id="ticker-text"></div>
    </div>

    <script>
        const vPlayers = [
            document.getElementById('v-player-1'),
            document.getElementById('v-player-2')
        ];
        const iPlayers = [
            document.getElementById('i-player-1'),
            document.getElementById('i-player-2')
        ];
        
        // Flattened list for the state machine
        const allPlayers = [...vPlayers, ...iPlayers];
        
        let activePlayer = null;

        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error-message');
        const loadingEl = document.getElementById('loading');
        const idleEl = document.getElementById('idle-screen');
        const emergencyOverlayEl = document.getElementById('emergency-overlay');
        const emergencyTextEl = document.getElementById('emergency-text');
        const emergencyMediaWrapEl = document.getElementById('emergency-media-wrap');
        const emergencyImageEl = document.getElementById('emergency-image');
        const emergencyVideoEl = document.getElementById('emergency-video');
        const tickerOverlayEl = document.getElementById('ticker-overlay');
        const tickerTextEl = document.getElementById('ticker-text');

        const bootStartedAt = performance.now();
        const ColdStartSplashMs = 10_000;
        const FadeMs = 600; // must match the .player opacity transition in CSS

        let currentPlaylist = [];
        let brandingItem = null;
        let emergencyItem = null;
        let tickerMessages = [];
        let currentTickerIndex = 0;
        let tickerRotationTimer = null;
        let currentIndex = 0;

        // Monotonic generation token: captured when an item starts playing. Every async
        // callback (image timer, pre-trigger, 'ended', error retry) advances only if its token
        // still matches playToken, so a callback for an item that is no longer current becomes a
        // no-op and can never double-advance / skip an item. Replaces the old isSwapping guard.
        let playToken = 0;
        let currentPlayingFilename = null;
        let imageTimer = null;
        let preTriggerTimer = null;
        let preTriggerScheduledToken = -1;
        // Distinct from preTriggerTimer: this is the "something failed, move on in 3s" retry,
        // kept separate so clearing one can never cancel the other.
        let retryTimer = null;

        const debugOverlayEnabled = new URLSearchParams(window.location.search).get('debugOverlay') === '1';
        document.addEventListener('keydown', e => {
            if (debugOverlayEnabled && e.ctrlKey && e.altKey && e.key.toLowerCase() === 'd') {
                e.preventDefault();
                statusEl.style.display = statusEl.style.display === 'none' ? 'block' : 'none';
            }
        });

        function updateStatus(message) {
            statusEl.textContent = `PlainSight Player\n${new Date().toLocaleTimeString()}\n${message}`;
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            loadingEl.style.display = 'none';
            idleEl.style.display = 'none';
            updateStatus('ERROR: ' + message);
        }

        function hideError() {
            errorEl.style.display = 'none';
        }

        function showIdle() {
            clearTimeout(imageTimer);
            clearTimeout(preTriggerTimer);
            clearTimeout(retryTimer);
            playToken++;
            currentPlayingFilename = null;
            allPlayers.forEach(p => {
                p.src = ''; 
                p.classList.remove('active', 'entering'); 
                if (p.tagName === 'VIDEO') p.load();
            });
            activePlayer = null;
            idleEl.style.display = 'flex';
            loadingEl.style.display = 'none';
            hideError();
            updateStatus('IDLE: Waiting for content');
            reportNowPlaying(null);
        }

        function hideIdle() {
            idleEl.style.display = 'none';
        }

        // Renders the emergency overlay as a pure visual layer on top of whatever is already
        // playing underneath, so stopping a broadcast resumes playback at the exact position
        // it was in — no interaction with the playlist state machine.
        function updateEmergencyOverlay() {
            if (!emergencyItem) {
                emergencyOverlayEl.style.display = 'none';
                emergencyVideoEl.pause();
                return;
            }

            emergencyOverlayEl.style.display = 'flex';

            if (emergencyItem.fileName && isValidFilename(emergencyItem.fileName)) {
                emergencyTextEl.style.display = 'none';
                emergencyMediaWrapEl.style.display = 'block';
                const src = contentSrc(emergencyItem.fileName);

                if (isVideo(emergencyItem.fileName)) {
                    emergencyImageEl.style.display = 'none';
                    emergencyVideoEl.style.display = 'block';
                    if (emergencyVideoEl.src !== src) {
                        emergencyVideoEl.src = src;
                    }
                    emergencyVideoEl.play().catch(() => { /* autoplay may be blocked until a user gesture; muted loop retries on next poll */ });
                } else {
                    emergencyVideoEl.style.display = 'none';
                    emergencyVideoEl.pause();
                    emergencyImageEl.style.display = 'block';
                    emergencyImageEl.src = src;
                }
            } else {
                emergencyMediaWrapEl.style.display = 'none';
                emergencyVideoEl.pause();
                emergencyTextEl.style.display = 'flex';
                emergencyTextEl.textContent = emergencyItem.message || '';
            }
        }

        function updateTickerOverlay() {
            clearTimeout(tickerRotationTimer);

            if (!tickerMessages || tickerMessages.length === 0) {
                tickerOverlayEl.style.display = 'none';
                return;
            }

            tickerOverlayEl.style.display = 'block';
            currentTickerIndex = 0;
            rotateTickerMessage();
        }

        function rotateTickerMessage() {
            if (!tickerMessages || tickerMessages.length === 0) {
                tickerOverlayEl.style.display = 'none';
                return;
            }

            const msg = tickerMessages[currentTickerIndex];
            tickerTextEl.textContent = msg.text;

            currentTickerIndex = (currentTickerIndex + 1) % tickerMessages.length;
            tickerRotationTimer = setTimeout(rotateTickerMessage, 4000);
        }

        // Resolves once the video has painted a frame, so we never fade into a black element.
        function waitForVideoFrame(video) {
            return new Promise(resolve => {
                if (video.requestVideoFrameCallback) {
                    video.requestVideoFrameCallback(() => resolve());
                } else {
                    resolve();
                }
            });
        }

        function isVideo(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return ['mp4', 'webm', 'mkv', 'avi', 'mov'].includes(ext);
        }

        function isValidFilename(name) {
            if (!name || typeof name !== 'string') return false;
            if (name.includes('..') || name.includes('/') || name.includes('\\')) {
                console.error('Path traversal attempt blocked:', name);
                return false;
            }
            return true;
        }

        async function reportNowPlaying(filename) {
            try {
                await fetch('/api/player/now-playing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename })
                });
            } catch (_) { /* non-critical */ }
        }

        function contentSrc(filename) {
            return new URL(`/content/${encodeURIComponent(filename)}`, window.location.origin).href;
        }

        // Returns the element prepareNextMedia() already preloaded for this file (its src matches);
        // otherwise the inactive element of the correct type. Deterministic, so the element we
        // preload is the element we actually play — no cold element / stale src on hand-off.
        function getNextPlayer(filename) {
            const pool = isVideo(filename) ? vPlayers : iPlayers;
            const src = contentSrc(filename);
            const preloaded = pool.find(p => p !== activePlayer && p.src === src);
            if (preloaded) {
                return preloaded;
            }
            return pool.find(p => p !== activePlayer) || pool[0];
        }

        // Computes the item that should follow the current one, honoring branding book-ending.
        function computeNext() {
            if (currentPlaylist.length === 0) {
                return null;
            }
            if (currentIndex === -1) {
                // Branding is playing; next is the first item.
                return { item: currentPlaylist[0], index: 0, isBranding: false };
            }
            if (currentIndex === currentPlaylist.length - 1 && brandingItem) {
                // At the end; next is branding.
                return { item: brandingItem, index: -1, isBranding: true };
            }
            const nextIndex = (currentIndex + 1) % currentPlaylist.length;
            return { item: currentPlaylist[nextIndex], index: nextIndex, isBranding: false };
        }

        function prepareNextMedia() {
            const next = computeNext();
            if (!next || !next.item) {
                return;
            }
            const nextFilename = next.item.fileName;
            if (!isValidFilename(nextFilename) || !isVideo(nextFilename)) {
                return;
            }
            const nextSrc = contentSrc(nextFilename);
            const target = vPlayers.find(p => p !== activePlayer);
            if (target && target.src !== nextSrc) {
                target.loop = false;
                target.preload = 'auto';
                target.src = nextSrc;
                target.load();
            }
        }

        // Advances to the item after the one identified by `token`. No-ops when the token is
        // stale — i.e. a newer item is already playing — which makes every caller (ended,
        // pre-trigger, image timer, error retry) idempotent and unable to skip an item.
        function advance(token, cause) {
            if (token !== playToken) {
                return;
            }
            const next = computeNext();
            if (!next) {
                showIdle();
                return;
            }
            playItem(next.item, next.index, next.isBranding, cause);
        }

        async function playItem(item, index, isBranding, cause) {
            clearTimeout(imageTimer);
            clearTimeout(preTriggerTimer);
            clearTimeout(retryTimer);
            preTriggerScheduledToken = -1;

            if (currentPlaylist.length === 0 || !item) {
                showIdle();
                return;
            }

            currentIndex = isBranding ? -1 : index;
            const token = ++playToken;
            const filename = item.fileName;

            if (debugOverlayEnabled) {
                console.log(`[PlainSight] advance cause=${cause || 'init'} token=${token} index=${isBranding ? 'branding' : currentIndex} file=${filename} t=${new Date().toISOString()}`);
            }

            if (!isValidFilename(filename)) {
                showError('Invalid media filename: ' + filename);
                retryTimer = setTimeout(() => advance(token, 'error'), 3000);
                return;
            }

            const duration = item.durationSeconds > 0 ? item.durationSeconds : 10;
            const src = contentSrc(filename);

            // Already playing this exact video and it hasn't ended: keep it on screen (single-item
            // loop) and just make sure the following item is preloaded.
            if (activePlayer && activePlayer.src === src && activePlayer.tagName === 'VIDEO' &&
                !activePlayer.paused && !activePlayer.ended && (currentPlaylist.length > 1 || isBranding)) {
                currentPlayingFilename = filename;
                activePlayer._playToken = token;
                prepareNextMedia();
                return;
            }

            const statusPrefix = isBranding ? '[BRANDING] ' : '';
            const statusIndex = isBranding ? '' : ` (${currentIndex + 1}/${currentPlaylist.length})`;
            updateStatus(`Playing: ${statusPrefix}${filename}${statusIndex} [${duration}s]`);
            hideIdle();

            const nextPlayer = getNextPlayer(filename);
            if (nextPlayer.src !== src) {
                nextPlayer.src = src;
            }
            nextPlayer._playToken = token;

            try {
                // Get the media fully ready while it is still invisible (opacity 0), so the
                // cross-fade reveals real content instead of a black/blank element.
                if (nextPlayer.tagName === 'VIDEO') {
                    nextPlayer.loop = false;
                    await nextPlayer.play();
                    await waitForVideoFrame(nextPlayer);
                } else {
                    // Decode the image before showing it; rejects if the file fails to load.
                    await nextPlayer.decode();
                    imageTimer = setTimeout(() => advance(token, 'timer'), duration * 1000);
                }

                // A newer item may have started while we awaited readiness — abandon this one.
                if (token !== playToken) {
                    return;
                }

                // Cross-fade: the ready media fades in on top while the outgoing content fades out.
                // The outgoing element keeps rendering during the fade, so its tail is not cut off.
                const outgoing = (activePlayer && activePlayer !== nextPlayer) ? activePlayer : null;
                nextPlayer.classList.add('entering', 'active');
                if (outgoing) {
                    outgoing.classList.remove('active');
                }
                setTimeout(() => nextPlayer.classList.remove('entering'), FadeMs);

                activePlayer = nextPlayer;
                currentPlayingFilename = filename;
                hideError();
                loadingEl.style.display = 'none';
                reportNowPlaying(filename);

                setTimeout(prepareNextMedia, 100);
            } catch (err) {
                console.error('Playback error:', err);
                showError(`Failed to play: ${filename}`);
                retryTimer = setTimeout(() => advance(token, 'error'), 3000);
            }
        }

        vPlayers.forEach((p) => {
            // Authoritative fallback: if the pre-trigger timer somehow didn't fire, the natural
            // 'ended' still advances. Stale 'ended' events (element no longer active, or its token
            // superseded) are filtered by the activePlayer check and advance()'s token guard.
            p.addEventListener('ended', () => {
                if (p !== activePlayer) return;
                advance(p._playToken, 'ended');
            });

            p.addEventListener('timeupdate', () => {
                if (p !== activePlayer || !(p.duration > 0)) return;
                // Schedule the cross-fade to begin exactly FadeMs before the true end, once per
                // item. A one-shot timer (rather than reacting to the ~4 Hz timeupdate threshold)
                // makes every hand-off land at a constant lead-in, so the 600 ms fade always
                // completes over real content and there is never a black frame between items.
                if (p.duration - p.currentTime <= 1 && preTriggerScheduledToken !== p._playToken) {
                    preTriggerScheduledToken = p._playToken;
                    const token = p._playToken;
                    const delay = Math.max(0, (p.duration - p.currentTime - FadeMs / 1000) * 1000);
                    preTriggerTimer = setTimeout(() => advance(token, 'pretrigger'), delay);
                }
            });

            p.addEventListener('error', () => {
                if (p !== activePlayer) return;
                console.error('Video error — trying next in 3s');
                showError('Video error. Trying next...');
                const token = p._playToken;
                retryTimer = setTimeout(() => advance(token, 'error'), 3000);
            });
        });

        async function loadPlaylistFromServer() {
            try {
                const res = await fetch('/api/playlist');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.reloadRequested) {
                    console.warn('Watchdog requested a page reload');
                    location.reload();
                    return;
                }

                const incomingItems = data.items || [];
                const incomingBranding = data.branding || null;
                const incomingEmergency = data.emergency || null;
                const incomingTicker = data.ticker || [];

                const hasItemsChanged = JSON.stringify(incomingItems) !== JSON.stringify(currentPlaylist);
                const hasBrandingChanged = JSON.stringify(incomingBranding) !== JSON.stringify(brandingItem);
                const hasEmergencyChanged = JSON.stringify(incomingEmergency) !== JSON.stringify(emergencyItem);
                const hasTickerChanged = JSON.stringify(incomingTicker) !== JSON.stringify(tickerMessages);

                if (hasEmergencyChanged) {
                    emergencyItem = incomingEmergency;
                    updateEmergencyOverlay();
                }

                if (hasTickerChanged) {
                    tickerMessages = incomingTicker;
                    updateTickerOverlay();
                }

                if (!hasItemsChanged && !hasBrandingChanged) return;

                const wasEmpty = currentPlaylist.length === 0;
                const playingFilename = currentPlayingFilename;
                currentPlaylist = incomingItems;
                brandingItem = incomingBranding;

                if (currentPlaylist.length === 0) {
                    // Honor the 10-second splash hold on first boot — never swap straight from splash to idle screen.
                    afterSplashHold(showIdle);
                    return;
                }

                updateStatus(`Playlist updated: ${currentPlaylist.length} item(s)` + (brandingItem ? ' + Branding' : ''));
                if (wasEmpty) {
                    afterSplashHold(() => playItem(currentPlaylist[0], 0, false, 'init'));
                } else if (currentIndex !== -1) {
                    // Re-locate the currently playing item in the new list so the next advance
                    // continues from the right place instead of an arbitrary index. Do not restart
                    // the current item if it is still present; fall back to 0 only if it is gone.
                    const foundIndex = currentPlaylist.findIndex(i => i.fileName === playingFilename);
                    currentIndex = foundIndex >= 0 ? foundIndex : 0;
                    prepareNextMedia();
                } else {
                    // Branding is playing; leave currentIndex = -1 so it advances into the first item.
                    prepareNextMedia();
                }
            } catch (err) {
                updateStatus('Waiting for playlist...');
            }
        }

        // Runs fn now if the 10s cold-start splash window has already elapsed; otherwise schedules it for when it has.
        function afterSplashHold(fn) {
            const elapsed = performance.now() - bootStartedAt;
            if (elapsed >= ColdStartSplashMs) {
                fn();
            } else {
                setTimeout(fn, ColdStartSplashMs - elapsed);
            }
        }

        loadPlaylistFromServer();
        // Polls the local (loopback) /api/playlist endpoint well under the 30s server heartbeat
        // interval so an emergency broadcast reaches the screen shortly after the player process
        // picks it up, rather than adding a second 30s hop on top of the heartbeat's own latency.
        setInterval(loadPlaylistFromServer, 5000);
        updateStatus('Waiting for content...');

    </script>
</body>
</html>
