<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlainSight Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            cursor: none;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }

        .player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
            opacity: 0;
            z-index: 10;
        }

        .player.active {
            opacity: 1;
            z-index: 20;
        }

        /* The 'entering' class ensures the new content is on top during cross-fade */
        .player.entering {
            opacity: 1;
            z-index: 30;
        }

        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.85);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 100;
            display: none;
            white-space: pre;
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 0, 0, 0.8);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
            max-width: 80%;
            text-align: center;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
        }

        #idle-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            display: none;
        }

        .logo-icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #3b82f6;
        }

        .idle-text {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .idle-subtext {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- We use four elements to allow seamless double-buffering for both videos and images -->
        <video id="v-player-1" class="player" autoplay muted playsinline></video>
        <video id="v-player-2" class="player" autoplay muted playsinline></video>
        <img id="i-player-1" class="player">
        <img id="i-player-2" class="player">
    </div>
    
    <div id="status"></div>
    <div id="error-message"></div>
    <div id="loading">Loading content...</div>
    
    <div id="idle-screen">
        <div class="logo-icon">👁️</div>
        <div class="idle-text">PlainSight</div>
        <div class="idle-subtext">Waiting for scheduled content...</div>
    </div>

    <script>
        const vPlayers = [
            document.getElementById('v-player-1'),
            document.getElementById('v-player-2')
        ];
        const iPlayers = [
            document.getElementById('i-player-1'),
            document.getElementById('i-player-2')
        ];
        
        // Flattened list for the state machine
        const allPlayers = [...vPlayers, ...iPlayers];
        
        let activePlayer = null;
        let nextVPlayerIndex = 0;
        let nextIPlayerIndex = 0;

        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error-message');
        const loadingEl = document.getElementById('loading');
        const idleEl = document.getElementById('idle-screen');

        let currentPlaylist = [];
        let brandingItem = null;
        let currentIndex = 0;
        let isSwapping = false;
        let imageTimer = null;

        const debugOverlayEnabled = new URLSearchParams(window.location.search).get('debugOverlay') === '1';
        document.addEventListener('keydown', e => {
            if (debugOverlayEnabled && e.ctrlKey && e.altKey && e.key.toLowerCase() === 'd') {
                e.preventDefault();
                statusEl.style.display = statusEl.style.display === 'none' ? 'block' : 'none';
            }
        });

        function updateStatus(message) {
            statusEl.textContent = `PlainSight Player\n${new Date().toLocaleTimeString()}\n${message}`;
        }

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            loadingEl.style.display = 'none';
            idleEl.style.display = 'none';
            updateStatus('ERROR: ' + message);
        }

        function hideError() {
            errorEl.style.display = 'none';
        }

        function showIdle() {
            clearTimeout(imageTimer);
            allPlayers.forEach(p => { 
                p.src = ''; 
                p.classList.remove('active', 'entering'); 
                if (p.tagName === 'VIDEO') p.load();
            });
            activePlayer = null;
            idleEl.style.display = 'flex';
            loadingEl.style.display = 'none';
            hideError();
            updateStatus('IDLE: Waiting for content');
            reportNowPlaying(null);
        }

        function hideIdle() {
            idleEl.style.display = 'none';
        }

        function isVideo(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return ['mp4', 'webm', 'mkv', 'avi', 'mov'].includes(ext);
        }

        function isValidFilename(name) {
            if (!name || typeof name !== 'string') return false;
            if (name.includes('..') || name.includes('/') || name.includes('\\')) {
                console.error('Path traversal attempt blocked:', name);
                return false;
            }
            return true;
        }

        async function reportNowPlaying(filename) {
            try {
                await fetch('/api/player/now-playing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename })
                });
            } catch (_) { /* non-critical */ }
        }

        function getNextPlayer(filename) {
            if (isVideo(filename)) {
                const p = vPlayers[nextVPlayerIndex];
                nextVPlayerIndex = (nextVPlayerIndex + 1) % vPlayers.length;
                return p;
            } else {
                const p = iPlayers[nextIPlayerIndex];
                nextIPlayerIndex = (nextIPlayerIndex + 1) % iPlayers.length;
                return p;
            }
        }

        function prepareNextMedia() {
            if (currentPlaylist.length === 0) return;

            let nextItem;
            if (currentIndex === -1) {
                // Currently playing branding, next is first item
                nextItem = currentPlaylist[0];
            } else if (currentIndex === currentPlaylist.length - 1 && brandingItem) {
                // At the end, next is branding
                nextItem = brandingItem;
            } else {
                const nextIndex = (currentIndex + 1) % currentPlaylist.length;
                nextItem = currentPlaylist[nextIndex];
            }

            if (!nextItem) return;
            const nextFilename = nextItem.fileName;
            const nextSrc = new URL(`/content/${encodeURIComponent(nextFilename)}`, window.location.origin).href;
            
            if (isVideo(nextFilename)) {
                const inactiveVPlayer = vPlayers.find(p => p !== activePlayer);
                if (inactiveVPlayer && inactiveVPlayer.src !== nextSrc) {
                    inactiveVPlayer.src = nextSrc;
                    inactiveVPlayer.load();
                }
            }
        }

        async function playMedia(index) {
            if (currentPlaylist.length === 0) {
                showIdle();
                return;
            }
            currentIndex = index % currentPlaylist.length;
            const item = currentPlaylist[currentIndex];
            await playItemInternal(item, false);
        }

        async function playItemInternal(item, isBranding) {
            if (isSwapping) return;
            isSwapping = true;
            clearTimeout(imageTimer);

            const filename = item.fileName;
            const duration = item.durationSeconds || 10;

            if (!isValidFilename(filename)) {
                showError('Invalid media filename: ' + filename);
                isSwapping = false;
                return;
            }

            const src = new URL(`/content/${encodeURIComponent(filename)}`, window.location.origin).href;
            const nextPlayer = getNextPlayer(filename);

            // If we are already playing this file and it's a video that hasn't ended, stay on it.
            // (Unless it's the ONLY item, then we loop it)
            if (activePlayer && activePlayer.src === src && activePlayer.tagName === 'VIDEO' && 
                !activePlayer.paused && !activePlayer.ended && (currentPlaylist.length > 1 || isBranding)) {
                isSwapping = false;
                prepareNextMedia();
                return;
            }

            const statusPrefix = isBranding ? '[BRANDING] ' : '';
            const statusIndex = isBranding ? '' : ` (${currentIndex + 1}/${currentPlaylist.length})`;
            updateStatus(`Playing: ${statusPrefix}${filename}${statusIndex} [${duration}s]`);
            hideIdle();

            // Prepare next element
            if (nextPlayer.src !== src) {
                nextPlayer.src = src;
            }
            
            try {
                nextPlayer.classList.add('entering');
                
                if (nextPlayer.tagName === 'VIDEO') {
                    nextPlayer.loop = false;
                    // For videos, we rely on the 'ended' event and natural duration.
                    await nextPlayer.play();
                } else {
                    // For images, we wait for load
                    await new Promise((resolve, reject) => {
                        if (nextPlayer.complete) resolve();
                        else {
                            nextPlayer.onload = resolve;
                            nextPlayer.onerror = reject;
                        }
                    });
                    
                    // Start timer for next transition based on server-provided duration
                    imageTimer = setTimeout(() => {
                        playNext();
                    }, duration * 1000);
                }
                
                // Perform the swap
                nextPlayer.classList.add('active');
                nextPlayer.classList.remove('entering');
                if (activePlayer && activePlayer !== nextPlayer) {
                    activePlayer.classList.remove('active');
                }
                
                activePlayer = nextPlayer;
                hideError();
                loadingEl.style.display = 'none';
                reportNowPlaying(filename);

                setTimeout(() => {
                    prepareNextMedia();
                }, 100);
            } catch (err) {
                console.error('Playback error:', err);
                showError(`Failed to play: ${filename}`);
                // Try next after a delay
                setTimeout(() => playNext(), 3000);
            } finally {
                isSwapping = false;
            }
        }

        function playNext() {
            if (currentIndex === -1) {
                // Branding finished, play first item
                currentIndex = 0;
                playMedia(0);
                return;
            }

            if (currentIndex === currentPlaylist.length - 1 && brandingItem) {
                // Playlist end reached, play branding
                playItemInternal(brandingItem, true);
                currentIndex = -1;
                return;
            }

            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playMedia(currentIndex);
        }

        vPlayers.forEach((p) => {
            p.addEventListener('ended', () => {
                if (p !== activePlayer) return;
                playNext();
            });

            p.addEventListener('timeupdate', () => {
                if (p !== activePlayer || isSwapping) return;
                // Pre-trigger next for tight loops
                if (p.duration > 0 && p.currentTime > p.duration - 0.15) {
                    playNext();
                }
            });

            p.addEventListener('error', () => {
                if (p !== activePlayer) return;
                console.error('Video error — trying next in 3s');
                showError('Video error. Trying next...');
                setTimeout(() => playNext(), 3000);
            });
        });

        async function loadPlaylistFromServer() {
            try {
                const res = await fetch('/api/playlist');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                const incomingItems = data.items || [];
                const incomingBranding = data.branding || null;

                const hasItemsChanged = JSON.stringify(incomingItems) !== JSON.stringify(currentPlaylist);
                const hasBrandingChanged = JSON.stringify(incomingBranding) !== JSON.stringify(brandingItem);

                if (!hasItemsChanged && !hasBrandingChanged) return;

                const wasEmpty = currentPlaylist.length === 0;
                currentPlaylist = incomingItems;
                brandingItem = incomingBranding;

                if (currentPlaylist.length === 0) {
                    showIdle();
                    return;
                }

                updateStatus(`Playlist updated: ${currentPlaylist.length} item(s)` + (brandingItem ? ' + Branding' : ''));
                if (wasEmpty) {
                    currentIndex = 0;
                    playMedia(0);
                } else {
                    prepareNextMedia();
                }
            } catch (err) {
                updateStatus('Waiting for playlist...');
            }
        }

        loadPlaylistFromServer();
        setInterval(loadPlaylistFromServer, 30000);
        updateStatus('Waiting for content...');
    </script>
</body>
</html>
