<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlainSight Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #video-player {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: #000;
        }

        #status {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.85);
            color: #00ff00; /* Bright green with good contrast */
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            display: none;
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 0, 0, 0.8);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
            max-width: 80%;
            text-align: center;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <video id="video-player" autoplay loop muted></video>
    <div id="status"></div>
    <div id="error-message"></div>
    <div class="loading" id="loading">Loading content...</div>

    <script>
        const video = document.getElementById('video-player');
        const status = document.getElementById('status');
        const errorMessage = document.getElementById('error-message');
        const loading = document.getElementById('loading');
        
        let currentPlaylist = [];
        let currentIndex = 0;
        let contentPath = '/mnt/signage/content';

        // Show debug status (toggle with Ctrl+D)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'd') {
                status.style.display = status.style.display === 'none' ? 'block' : 'none';
            }
        });

        // Function to update status display
        function updateStatus(message) {
            const now = new Date().toLocaleTimeString();
            status.innerHTML = `<strong>PlainSight Player</strong><br>${now}<br>${message}`;
        }

        // Function to show error
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            loading.style.display = 'none';
            updateStatus('ERROR: ' + message);
        }

        // Function to hide error
        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Function to play video from playlist
        function playVideo(index) {
            if (currentPlaylist.length === 0) {
                showError('No content available. Check /mnt/signage/content');
                return;
            }

            currentIndex = index % currentPlaylist.length;
            const videoFile = currentPlaylist[currentIndex];
            const videoPath = `app://${contentPath}/${videoFile}`;

            updateStatus(`Playing: ${videoFile} (${currentIndex + 1}/${currentPlaylist.length})`);
            
            video.src = videoPath;
            video.load();
            video.play()
                .then(() => {
                    hideError();
                    loading.style.display = 'none';
                })
                .catch(err => {
                    console.error('Video playback error:', err);
                    showError(`Failed to play: ${videoFile}`);
                });
        }

        // Function to play next video
        function playNext() {
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playVideo(currentIndex);
        }

        // Video ended event - play next video
        video.addEventListener('ended', () => {
            playNext();
        });

        // Video error event
        video.addEventListener('error', (e) => {
            console.error('Video error:', e);
            showError('Video playback error. Trying next video...');
            setTimeout(() => playNext(), 3000);
        });

        // Function called from C# to set content path
        window.setContentPath = function(path) {
            contentPath = path;
            updateStatus(`Content path: ${path}`);
        };

        // Function called from C# to load playlist
        window.loadPlaylist = function(playlist) {
            try {
                currentPlaylist = JSON.parse(playlist);
                updateStatus(`Loaded ${currentPlaylist.length} videos`);
                if (currentPlaylist.length > 0) {
                    playVideo(0);
                } else {
                    showError('Playlist is empty');
                }
            } catch (err) {
                console.error('Failed to parse playlist:', err);
                showError('Failed to load playlist');
            }
        };

        // Function called from C# to play specific file
        window.playFile = function(filename) {
            const videoPath = `app://${contentPath}/${filename}`;
            updateStatus(`Playing: ${filename}`);
            video.src = videoPath;
            video.play()
                .then(() => {
                    hideError();
                    loading.style.display = 'none';
                })
                .catch(err => {
                    console.error('Video playback error:', err);
                    showError(`Failed to play: ${filename}`);
                });
        };

        // Initial status
        updateStatus('Waiting for content...');
    </script>
</body>
</html>
