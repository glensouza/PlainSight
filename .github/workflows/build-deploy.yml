name: Build and Deploy PlainSight

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/plainsight-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./src/PlainSight.Server/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check if package exists
      if: github.event_name != 'pull_request'
      id: check-package
      continue-on-error: true
      run: |
        # URL-encode the package name (replace / with %2F)
        PACKAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | sed 's/\//%2F/g')
        # Try org endpoint first, then user endpoint
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}")
        if [ "$RESPONSE" = "404" ]; then
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}")
        fi
        if [ "$RESPONSE" = "200" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "::warning::Package not found - skipping cleanup"
        fi

    - name: Clean up old images (keep 5 most recent)
      if: github.event_name != 'pull_request' && steps.check-package.outputs.exists == 'true'
      uses: actions/delete-package-versions@v5
      with:
        package-name: ${{ env.IMAGE_NAME }}
        package-type: 'container'
        min-versions-to-keep: 5
        delete-only-untagged-versions: 'false'

  build-player:
    # One-time keypair generation (maintainer, offline):
    #   openssl ecparam -name prime256v1 -genkey -noout -out signing.key
    #   openssl pkcs8 -topk8 -nocrypt -in signing.key -out signing.pkcs8
    #   openssl ec -in signing.key -pubout -out release-signing.pub
    # Add the contents of signing.pkcs8 as the secret PLAINSIGHT_SIGNING_KEY.
    # Commit release-signing.pub to src/PlainSight.Server/Keys/.
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Player for Raspberry Pi (ARM64)
      run: |
        dotnet publish src/PlainSight.Player/PlainSight.Player.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained \
          -p:PublishSingleFile=true \
          -p:DebugType=None \
          -p:DebugSymbols=false \
          -o ./publish/player

    - name: Create artifact archives
      run: |
        set -euo pipefail
        cd ./publish/player
        tar -czf ../plainsight-player-${{ github.ref_name }}.tar.gz *
        cd ../..

    - name: Validate UPDATES_PATH
      run: |
        set -euo pipefail
        if [ -z "${{ vars.UPDATES_PATH }}" ]; then
          echo "::error::vars.UPDATES_PATH not configured — cannot write binary to the share. Set the UPDATES_PATH variable in the repository or environment settings."
          exit 1
        fi

    - name: Copy binary to share
      env:
        REF_NAME: ${{ github.ref_name }}
        UPDATES_PATH_RAW: ${{ vars.UPDATES_PATH }}
      run: |
        set -euo pipefail
        # Strip leading 'v' from the tag name to get a bare semver (e.g. v1.2.0 → 1.2.0)
        REF_NAME_VAR="$REF_NAME"
        VERSION="${REF_NAME_VAR#v}"
        UPDATES_PATH="$UPDATES_PATH_RAW"
        FILE_NAME="plainsight-player-${VERSION}"
        SRC_BINARY="./publish/player/PlainSight.Player"
        # Write to a .tmp file first, then rename for an atomic replacement on a local FS
        cp "${SRC_BINARY}" "${UPDATES_PATH}/${FILE_NAME}.tmp"
        mv "${UPDATES_PATH}/${FILE_NAME}.tmp" "${UPDATES_PATH}/${FILE_NAME}"
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "FILE_NAME=${FILE_NAME}" >> "$GITHUB_ENV"
        echo "UPDATES_PATH=${UPDATES_PATH}" >> "$GITHUB_ENV"

    - name: Build and sign manifest
      env:
        PLAINSIGHT_SIGNING_KEY: ${{ secrets.PLAINSIGHT_SIGNING_KEY }}
        REF_NAME: ${{ github.ref_name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        VERSION="${VERSION}"
        FILE_NAME="${FILE_NAME}"
        UPDATES_PATH="${UPDATES_PATH}"
        BINARY_PATH="${UPDATES_PATH}/${FILE_NAME}"

        # Compute SHA-256 (lowercase hex, no filename suffix)
        SHA256=$(sha256sum "${BINARY_PATH}" | awk '{ print $1 }')

        # Compute file size in bytes
        SIZE_BYTES=$(stat --format='%s' "${BINARY_PATH}")

        # ISO-8601 UTC timestamp
        SIGNED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        RELEASE_URL="https://github.com/${REPOSITORY}/releases/tag/${REF_NAME}"

        # Build canonical JSON (sorted keys, compact) — this is what gets signed.
        # The 'signature' field is intentionally absent here; verifiers must
        # re-canonicalise the on-disk manifest minus 'signature' to reproduce
        # the exact byte sequence that was signed.
        CANONICAL_JSON=$(jq \
          --sort-keys \
          --compact-output \
          --null-input \
          --arg version "${VERSION}" \
          --arg fileName "${FILE_NAME}" \
          --argjson sizeBytes "${SIZE_BYTES}" \
          --arg sha256 "${SHA256}" \
          --arg signedAt "${SIGNED_AT}" \
          --arg releaseUrl "${RELEASE_URL}" \
          --arg notes "" \
          '{
            "fileName": $fileName,
            "notes": $notes,
            "releaseUrl": $releaseUrl,
            "sha256": $sha256,
            "signedAt": $signedAt,
            "sizeBytes": $sizeBytes,
            "version": $version
          }')

        # Sign the canonical JSON with ECDSA-SHA256.
        # The key is fed via process substitution to avoid writing it to disk.
        # We deliberately do NOT echo PLAINSIGHT_SIGNING_KEY anywhere in this script.
        SIG_B64=$(printf '%s' "${CANONICAL_JSON}" \
          | openssl dgst -sha256 -sign <(printf '%s' "${PLAINSIGHT_SIGNING_KEY}") \
          | base64 -w 0)

        # Append the 'signature' field to produce the final on-disk manifest.
        # This manifest is NOT canonical (extra field); verifiers must strip
        # 'signature' and re-sort before verifying — see ManifestReconciler.
        FINAL_MANIFEST=$(printf '%s' "${CANONICAL_JSON}" \
          | jq --compact-output --arg sig "${SIG_B64}" '. + {"signature": $sig}')

        # Write manifest next to the binary
        MANIFEST_PATH="${UPDATES_PATH}/${FILE_NAME}.json"
        printf '%s' "${FINAL_MANIFEST}" > "${MANIFEST_PATH}"

        echo "MANIFEST_PATH=${MANIFEST_PATH}" >> "$GITHUB_ENV"
        echo "Manifest written to ${MANIFEST_PATH}"

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/plainsight-player-${{ github.ref_name }}.tar.gz
          ${{ env.MANIFEST_PATH }}
        generate_release_notes: true

  deploy-to-server:
    runs-on: self-hosted
    needs: build-and-push
    # Only run if DEPLOYMENT_PATH secret is configured
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_PATH != ''
    
    steps:
    - name: Deploy to production server
      run: |
        cd ${{ vars.DEPLOYMENT_PATH }}
        docker compose pull plainsight-server
        docker compose up -d plainsight-server
        
    - name: Verify deployment
      run: |
        sleep 10
        curl -f http://localhost:8080/health || exit 1
