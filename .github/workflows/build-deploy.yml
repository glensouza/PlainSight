name: Build and Deploy PlainSight

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/signage-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./src/Signage.Server/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Clean up old images (keep 5 most recent)
      if: github.event_name != 'pull_request'
      uses: actions/delete-package-versions@v5
      with:
        package-name: 'signage-server'
        package-type: 'container'
        min-versions-to-keep: 5
        delete-only-untagged-versions: 'false'

  build-player:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Player for Raspberry Pi (ARM64)
      run: |
        dotnet publish src/Signage.Player/Signage.Player.csproj \
          -c Release \
          -r linux-arm64 \
          --self-contained \
          -p:PublishSingleFile=true \
          -p:DebugType=None \
          -p:DebugSymbols=false \
          -o ./publish/player

    - name: Create artifact archive
      run: |
        cd ./publish/player
        tar -czf ../signage-player-${{ github.ref_name }}.tar.gz *
        cd ../..

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/signage-player-${{ github.ref_name }}.tar.gz
        generate_release_notes: true

  deploy-to-server:
    runs-on: self-hosted
    needs: build-and-push
    # Only run if DEPLOYMENT_PATH secret is configured
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_PATH != ''
    
    steps:
    - name: Deploy to production server
      run: |
        cd ${{ vars.DEPLOYMENT_PATH }}
        docker compose pull signage-server
        docker compose up -d signage-server
        
    - name: Verify deployment
      run: |
        sleep 10
        curl -f http://localhost:8080/health || exit 1
