name: Server CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/PlainSight.Shared/**'
      - 'src/PlainSight.Server/**'
      - 'docker-compose.yml'
      - 'version.txt'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: plainsight-server
  COMPOSE_PROJECT_NAME: plainsight
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Ensure only one deployment runs at a time and cancel older runs
concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set Version
      run: |
        set -euo pipefail
        MAJOR_MINOR=$(cat version.txt | tr -d '[:space:]')
        STATE_FILE="${HOME}/.plainsight/server-build-state"
        mkdir -p "${HOME}/.plainsight"

        PREV_MAJOR_MINOR=""
        PREV_PATCH=-1
        if [ -f "${STATE_FILE}" ]; then
          while IFS='=' read -r key value; do
            case "${key}" in
              MAJOR_MINOR) PREV_MAJOR_MINOR="${value}" ;;
              PATCH)       PREV_PATCH="${value}" ;;
            esac
          done < "${STATE_FILE}"
        fi

        if [ "${MAJOR_MINOR}" = "${PREV_MAJOR_MINOR}" ]; then
          PATCH=$((PREV_PATCH + 1))
        else
          PATCH=0
        fi

        printf 'MAJOR_MINOR=%s\nPATCH=%d\n' "${MAJOR_MINOR}" "${PATCH}" > "${STATE_FILE}"

        BUILD_TAG="${MAJOR_MINOR}.${PATCH}"
        echo "BUILD_TAG=${BUILD_TAG}" >> $GITHUB_ENV
        echo "MAJOR_MINOR=${MAJOR_MINOR}" >> $GITHUB_ENV
        echo "Building version ${BUILD_TAG}"

    - name: Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:${{ env.BUILD_TAG }} \
          --build-arg BUILD_VERSION=${{ env.BUILD_TAG }} \
          -f src/PlainSight.Server/Dockerfile .

    - name: Deploy and Verify
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
        PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
        OBS_WEBSOCKET_URL: ${{ secrets.OBS_WEBSOCKET_URL }}
        OBS_WEBSOCKET_PASSWORD: ${{ secrets.OBS_WEBSOCKET_PASSWORD }}
        ALERTS_EMAIL_PASSWORD: ${{ secrets.ALERTS_EMAIL_PASSWORD }}
      run: |
        # Backup the current 'current' tag to 'previous'
        docker tag ${{ env.IMAGE_NAME }}:current ${{ env.IMAGE_NAME }}:previous || true

        # Tag the new build as 'current'
        docker tag ${{ env.IMAGE_NAME }}:${{ env.BUILD_TAG }} ${{ env.IMAGE_NAME }}:current

        echo "Starting deployment of ${{ env.BUILD_TAG }}..."
        docker compose up -d

        echo "Waiting for health check..."
        MAX_RETRIES=20
        COUNT=0
        SUCCESS=0

        while [ $COUNT -lt $MAX_RETRIES ]; do
          if curl -s -f http://localhost:8080/health; then
            SUCCESS=1
            break
          fi
          echo "Health check failed, retrying in 10s ($(($COUNT+1))/$MAX_RETRIES)..."
          docker logs --tail 20 plainsight-server || true
          sleep 10
          COUNT=$(($COUNT+1))
        done

        if [ $SUCCESS -eq 1 ]; then
          echo "Deployment successful!"
          # Cleanup: Keep only 5 most recent images (excluding 'current', 'previous').
          # Escape dots in MAJOR_MINOR for use as a regex pattern.
          ESCAPED=$(printf '%s' "${{ env.MAJOR_MINOR }}" | sed 's/\./\\./g')
          docker images ${{ env.IMAGE_NAME }} --format "{{.Tag}}" \
            | grep -E "^${ESCAPED}\.[0-9]+$" \
            | sort -V -r \
            | tail -n +6 \
            | xargs -I {} docker rmi ${{ env.IMAGE_NAME }}:{} || true
        else
          echo "::error::Deployment failed health check! Rolling back..."
          docker tag ${{ env.IMAGE_NAME }}:previous ${{ env.IMAGE_NAME }}:current
          docker compose up -d plainsight-server
          exit 1
        fi

    - name: Prune untagged images
      run: docker image prune -f
