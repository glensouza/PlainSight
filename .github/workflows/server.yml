name: Server CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/PlainSight.Shared/**'
      - 'src/PlainSight.Server/**'
      - 'docker-compose.yml'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: plainsight-server
  COMPOSE_PROJECT_NAME: plainsight

jobs:
  build-and-deploy:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        SHA_TAG=$(git rev-parse --short HEAD)
        echo "SHA_TAG=${SHA_TAG}" >> $GITHUB_ENV
        docker build -t ${{ env.IMAGE_NAME }}:${SHA_TAG} -f src/PlainSight.Server/Dockerfile .

    - name: Deploy and Verify
      env:
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
        PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
      run: |
        # Save the current tag if it exists for rollback
        PREVIOUS_TAG=$(docker images ${{ env.IMAGE_NAME }} --format "{{.Tag}}" | grep -v "latest" | grep -v "current" | head -n 1 || echo "")
        
        # Backup the current 'current' tag to 'previous'
        docker tag ${{ env.IMAGE_NAME }}:current ${{ env.IMAGE_NAME }}:previous || true
        
        # Tag the new build as 'current'
        docker tag ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }} ${{ env.IMAGE_NAME }}:current
        
        echo "Starting deployment of ${{ env.SHA_TAG }}..."
        docker compose up -d
        
        echo "Waiting for health check..."
        MAX_RETRIES=20
        COUNT=0
        SUCCESS=0
        
        while [ $COUNT -lt $MAX_RETRIES ]; do
          # -S (show error), -f (fail on error), -v (verbose if needed)
          if curl -s -f http://localhost:8080/health; then
            SUCCESS=1
            break
          fi
          echo "Health check failed, retrying in 10s ($(($COUNT+1))/$MAX_RETRIES)..."
          # Optional: Print container logs to see why it's failing
          docker logs --tail 20 plainsight-server || true
          sleep 10
          COUNT=$(($COUNT+1))
        done
        
        if [ $SUCCESS -eq 1 ]; then
          echo "Deployment successful!"
          # Cleanup: Keep only 5 most recent images (excluding 'current', 'previous', and intermediate builds)
          # We list tags, sort them, and remove all but the top 5
          docker images ${{ env.IMAGE_NAME }} --format "{{.Tag}}" | grep -E "^[a-f0-9]{7}$" | sort -r | tail -n +6 | xargs -I {} docker rmi ${{ env.IMAGE_NAME }}:{} || true
        else
          echo "::error::Deployment failed health check! Rolling back..."
          docker tag ${{ env.IMAGE_NAME }}:previous ${{ env.IMAGE_NAME }}:current
          docker compose up -d plainsight-server
          exit 1
        fi

    - name: Prune untagged images
      run: docker image prune -f
