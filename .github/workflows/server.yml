name: Server CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'src/PlainSight.Shared/**'
      - 'src/PlainSight.Server/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/PlainSight.Shared/**'
      - 'src/PlainSight.Server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/plainsight-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./src/PlainSight.Server/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check if package exists
      if: github.event_name != 'pull_request'
      id: check-package
      continue-on-error: true
      run: |
        # URL-encode the package name (replace / with %2F)
        PACKAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | sed 's/\//%2F/g')
        # Try org endpoint first, then user endpoint
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}")
        if [ "$RESPONSE" = "404" ]; then
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${PACKAGE_NAME}")
        fi
        if [ "$RESPONSE" = "200" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "::warning::Package not found - skipping cleanup"
        fi

    - name: Clean up old images (keep 5 most recent)
      if: github.event_name != 'pull_request' && steps.check-package.outputs.exists == 'true'
      uses: actions/delete-package-versions@v5
      with:
        package-name: ${{ env.IMAGE_NAME }}
        package-type: 'container'
        min-versions-to-keep: 5
        delete-only-untagged-versions: 'false'

  deploy-to-server:
    runs-on: self-hosted
    needs: build-and-push
    # Only run if DEPLOYMENT_PATH secret is configured
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_PATH != ''
    
    steps:
    - name: Deploy to production server
      run: |
        cd ${{ vars.DEPLOYMENT_PATH }}
        docker compose pull plainsight-server
        docker compose up -d plainsight-server
        
    - name: Verify deployment
      run: |
        sleep 10
        curl -f http://localhost:8080/health || exit 1
