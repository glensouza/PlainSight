services:
  postgres:
    image: postgres:17
    container_name: plainsight-postgres
    environment:
      POSTGRES_USER: plainsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: plainsightdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - plainsight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plainsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  plainsight-server:
    image: plainsight-server:current
    container_name: plainsight-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__plainsightdb=Host=postgres;Database=plainsightdb;Username=plainsight;Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/MyCloudHome/PlainSight:/mnt/plainsight
    networks:
      - plainsight-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare Tunnel to expose the server securely
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: plainsight-cloudflared
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN environment variable is required}
    command: tunnel --no-autoupdate run
    networks:
      - plainsight-network
    restart: unless-stopped
    depends_on:
      - plainsight-server

  # Database management interface
  pgadmin:
    image: dpage/pgadmin4
    container_name: plainsight-pgadmin
    ports:
      - "5050:80"
    volumes:
      - ./src/PlainSight.Server/Data/pgadmin_servers.json:/pgadmin4/servers.json
    # Inject pgpass on startup to automate database password entry
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "echo \"postgres:5432:plainsightdb:plainsight:$${POSTGRES_PASSWORD}\" > /tmp/pgpass && chmod 600 /tmp/pgpass && /entrypoint.sh"
    environment:
      - PGADMIN_DEFAULT_EMAIL=$${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL environment variable is required}
      - PGADMIN_DEFAULT_PASSWORD=$${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD environment variable is required}
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    networks:
      - plainsight-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  plainsight-network:
    driver: bridge
